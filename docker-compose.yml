# docker-compose.yml
version: '3.8'

services:
  telecom-rag:
    build: .
    container_name: telecom-rag
    ports:
      - "8501:8501"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./embeddings.json:/app/embeddings.json
      - ./data:/app/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    restart: unless-stopped